name: Meridian Blind Launcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/meridian-blind-launcher.yml'
      - 'cleanroom-launch/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'cleanroom/**'
      - '.github/workflows/meridian-blind.yml'

permissions:
  contents: write
  copilot-requests: write

jobs:
  blind-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Meridian branch
        uses: actions/checkout@v4
        with:
          ref: meridian-blind-002
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run evaluator and preserve diagnostics
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python cleanroom/run_meridian_blind_copilot.py > /tmp/meridian002.log 2>&1
          status=$?
          mkdir -p results
          if [ "$status" -ne 0 ]; then
            {
              echo '# MERIDIAN-BLIND-002 runner failure'
              echo
              echo "Exit status: $status"
              echo
              echo '```text'
              tail -n 200 /tmp/meridian002.log
              echo '```'
            } > results/MERIDIAN-BLIND-002.failure.md
          else
            rm -f results/MERIDIAN-BLIND-002.failure.md
          fi
          cat /tmp/meridian002.log
          exit 0

      - name: Freeze memo or failure diagnostic on isolated branch
        shell: bash
        run: |
          git config user.name 'ai-q-cleanroom-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/MERIDIAN-BLIND-002.md results/MERIDIAN-BLIND-002.metadata.json results/MERIDIAN-BLIND-002.failure.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No result or diagnostic to commit.'
            exit 0
          fi
          git commit -m 'Freeze MERIDIAN-BLIND-002 result or diagnostic [skip ci]'
          git push origin HEAD:meridian-blind-002
