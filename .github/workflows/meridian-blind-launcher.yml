name: Meridian Blind Launcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/meridian-blind-launcher.yml'
      - 'cleanroom-launch/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'cleanroom/**'
      - '.github/workflows/meridian-blind.yml'

permissions:
  contents: write
  copilot-requests: write

jobs:
  blind-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Meridian branch
        uses: actions/checkout@v4
        with:
          ref: meridian-blind-002
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run independent evaluator through Copilot CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python cleanroom/run_meridian_blind_copilot.py

      - name: Freeze first-pass memo on isolated branch
        run: |
          git config user.name 'ai-q-cleanroom-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/MERIDIAN-BLIND-002.md results/MERIDIAN-BLIND-002.metadata.json
          if git diff --cached --quiet; then
            echo 'No new result to commit.'
            exit 0
          fi
          git commit -m 'Freeze MERIDIAN-BLIND-002 first-pass memo [skip ci]'
          git push origin HEAD:meridian-blind-002
